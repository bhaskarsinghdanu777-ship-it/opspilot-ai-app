# ==============================================================================
# OpsPilot AI — Netlify Production Configuration
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["firebase-applet-config.json"]

# 1. Forward all API calls to Netlify Functions running the Express server
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. Forward /health check
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

# 3. SPA Client Routing: Rewrite unmatched URLs to index.html for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
